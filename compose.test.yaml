services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: studio_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/db/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./supabase/migrations/202609240001_initial.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./supabase/migrations/202609240002_contact_limit.sql:/docker-entrypoint-initdb.d/02-contact.sql:ro
      - ./supabase/migrations/202609290001_content_translations.sql:/docker-entrypoint-initdb.d/03-translations.sql:ro
      - ./supabase/migrations/202610020001_studio_features.sql:/docker-entrypoint-initdb.d/04-studio-features.sql:ro
      - ./tests/db/features.sql:/tests/features.sql:ro
      - ./tests/db/translations.sql:/tests/translations.sql:ro
      - ./tests/db/policies.sql:/tests/policies.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d studio_test']
      interval: 2s
      timeout: 3s
      retries: 30
