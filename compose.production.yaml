services:
  production:
    image: yos-studio:local
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_SITE_URL: ${PRODUCTION_SITE_URL:-http://localhost:3001}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_SITE_URL: ${PRODUCTION_SITE_URL:-http://localhost:3001}
    ports:
      - '3001:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
